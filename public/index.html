<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6B00" />
    <meta name="description" content="Dock ratings, AI co-driver, route intelligence, and detention tools for CDL drivers." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DockWarrior" />

    <!-- Open Graph -->
    <meta property="og:title" content="DockWarrior — Trucking Intelligence" />
    <meta property="og:description" content="Dock ratings, AI co-driver, detention tools. Built for CDL drivers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.dockwarrior.com" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="%PUBLIC_URL%/icons/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="%PUBLIC_URL%/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="%PUBLIC_URL%/icons/icon-128x128.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="%PUBLIC_URL%/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192x192.png" />

    <!-- Apple Splash Screens -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>DockWarrior</title>

    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(reg) {
              console.log('SW registered:', reg.scope)
            })
            .catch(function(err) {
              console.log('SW registration failed:', err)
            })
        })
      }

      // PWA install prompt
      let deferredPrompt
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault()
        deferredPrompt = e
        window.deferredInstallPrompt = e
      })
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run DockWarrior.</noscript>
    <div id="root"></div>
  </body>
</html>
